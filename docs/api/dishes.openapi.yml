openapi: 3.1.0
info:
  title: Resttek API - Platos
  version: 1.0.0
  description: |
    Documentación de los endpoints de **platos** (`dishes`) de la API de Resttek, una plataforma de gestión de restaurantes.

    Un plato pertenece a un restaurante y puede tener una lista de ingredientes con la cantidad necesaria de cada uno
    (relación N:M `dish_ingredients`). Los ingredientes se gestionan en `ingredients.openapi.yml`.

    ## Autenticación
    Los endpoints privados exigen un JWT en la cabecera `Authorization: Bearer <token>` (se obtiene en `/auth/login`).
    El token se valida con `authenticate` y el rol del usuario con `authorize`. Roles existentes: `admin`, `manager`,
    `camarero`, `cocinero`, `cliente`. El endpoint público de la carta no requiere autenticación.

    ## Formato de errores
    - Errores de dominio (clases que extienden `AppError`): cuerpo `{ "error": "<NombreDelError>", "message": "<texto en inglés>" }`.
      Estado `404` para los `*NotFoundError`, `401` para `InvalidCredentialsError` y `400` para el resto.
    - Errores de autenticación/autorización (middlewares): cuerpo `{ "error": "<texto>" }` (sin campo `message`), estados `401` y `403`.
    - Cualquier otro error no controlado (incluidos fallos de SQLite y errores de tipo): `500` con
      `{ "error": "InternalServerError", "message": "Something went wrong" }`.

    ## Consideraciones generales (comportamiento real del código)
    - El `restaurantId` de la ruta **no se valida** contra la tabla de restaurantes ni contra el restaurante del usuario
      autenticado: listar platos de un restaurante inexistente devuelve `200` con `[]`, y crear un plato en un restaurante
      inexistente falla con `500` (violación de clave foránea de SQLite).
    - Las operaciones por `id` (`GET`, `PUT`, `DELETE`) buscan el plato solo por su `id`; **no comprueban** que pertenezca
      al `restaurantId` de la ruta.
    - No hay paginación ni filtros en los listados.
  contact:
    name: Equipo Resttek
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local de desarrollo
tags:
  - name: Platos
    description: Gestión de la carta de platos de un restaurante (requiere autenticación).
  - name: Platos (público)
    description: Consulta pública de la carta, sin autenticación.
security:
  - bearerAuth: []
paths:
  /restaurants/{restaurantId}/dishes:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Platos]
      operationId: createDish
      summary: Crear un plato
      description: |
        Crea un plato en el restaurante indicado.

        **Roles permitidos:** `admin`, `manager`.

        Valores por defecto si se omiten: `description` = `null`, `available` = `true`, `ingredients` = `[]`.
        El `id` (UUID) y las marcas `createdAt`/`updatedAt` los genera el servidor.

        Orden de validación: `name` (no vacío) -> `price` (> 0) -> `category` (enumerado, no sensible a mayúsculas ni espacios)
        -> cada elemento de `ingredients`.

        **Ambigüedades / comportamiento a tener en cuenta:**
        - Solo se comprueban las reglas de negocio; no se valida el tipo JSON de los campos. Un `price` ausente falla en
          la base de datos (`500`), y una `category` ausente o un `name` que no sea cadena provocan un error de tipo (`500`),
          no un `400`.
        - Los errores de los elementos de `ingredients` (`ingredientId` vacío o `quantity` <= 0) se lanzan como `Error` genérico,
          por lo que la API responde `500 InternalServerError` y no `400`.
        - `ingredientId` debe existir en la tabla `ingredients` (FK de SQLite); si no existe, o si se repite en la lista
          (clave primaria compuesta), la respuesta es `500`. No se comprueba que el ingrediente pertenezca al mismo restaurante.
        - La escritura no es transaccional: si falla la inserción de los ingredientes, el plato ya puede haberse insertado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishCreateRequest'
            examples:
              completo:
                summary: Plato con ingredientes
                value:
                  name: Pizza Margarita
                  description: Pizza clásica con tomate, mozzarella y albahaca
                  price: 12.5
                  category: principal
                  available: true
                  ingredients:
                    - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                      quantity: 0.3
                    - ingredientId: 9b7d6e5f-1a2b-4c3d-8e9f-0a1b2c3d4e5f
                      quantity: 0.4
              minimo:
                summary: Solo campos obligatorios
                value:
                  name: Flan casero
                  price: 4.5
                  category: postre
      responses:
        '201':
          description: Plato creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
              example:
                id: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
                name: Pizza Margarita
                description: Pizza clásica con tomate, mozzarella y albahaca
                price: 12.5
                category: principal
                available: true
                restaurantId: rest-1
                ingredients:
                  - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                    quantity: 0.3
                  - ingredientId: 9b7d6e5f-1a2b-4c3d-8e9f-0a1b2c3d4e5f
                    quantity: 0.4
                createdAt: '2026-11-19T10:15:30.000Z'
                updatedAt: '2026-11-19T10:15:30.000Z'
        '400':
          $ref: '#/components/responses/DishValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Platos]
      operationId: listDishes
      summary: Listar los platos de un restaurante
      description: |
        Devuelve todos los platos del restaurante (disponibles o no) con sus ingredientes.

        **Roles permitidos:** `admin`, `manager`, `camarero`, `cocinero`.

        Si el restaurante no existe o no tiene platos devuelve `200` con una lista vacía (no hay `404`).
        Sin paginación ni orden garantizado.
      responses:
        '200':
          description: Lista de platos del restaurante.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
              example:
                - id: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
                  name: Pizza Margarita
                  description: Pizza clásica con tomate, mozzarella y albahaca
                  price: 12.5
                  category: principal
                  available: true
                  restaurantId: rest-1
                  ingredients:
                    - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                      quantity: 0.3
                  createdAt: '2026-11-19T10:15:30.000Z'
                  updatedAt: '2026-11-19T10:15:30.000Z'
                - id: 8e2f4a6c-0b1d-4e3f-a5b7-c9d1e3f5a7b9
                  name: Tarta de queso
                  description: null
                  price: 5.9
                  category: postre
                  available: false
                  restaurantId: rest-1
                  ingredients: []
                  createdAt: '2026-11-18T09:00:00.000Z'
                  updatedAt: '2026-11-19T08:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /restaurants/{restaurantId}/dishes/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/DishId'
    get:
      tags: [Platos]
      operationId: getDishById
      summary: Obtener un plato por id
      description: |
        Devuelve un plato con sus ingredientes.

        **Roles permitidos:** `admin`, `manager`, `camarero`, `cocinero`.

        La búsqueda se hace solo por `id`; no se comprueba que el plato pertenezca al `restaurantId` de la ruta.
      responses:
        '200':
          description: Plato encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
              example:
                id: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
                name: Pizza Margarita
                description: Pizza clásica con tomate, mozzarella y albahaca
                price: 12.5
                category: principal
                available: true
                restaurantId: rest-1
                ingredients:
                  - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                    quantity: 0.3
                createdAt: '2026-11-19T10:15:30.000Z'
                updatedAt: '2026-11-19T10:15:30.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Platos]
      operationId: updateDish
      summary: Actualizar un plato (reemplazo completo)
      description: |
        Reemplaza los datos del plato y su lista de ingredientes. Conserva `id`, `restaurantId` y `createdAt`;
        actualiza `updatedAt`.

        **Roles permitidos:** `admin`, `manager`.

        Se comprueba primero que el plato existe (`404`) y después se aplican las mismas validaciones que en la creación (`400`).

        **Ambigüedades / comportamiento a tener en cuenta:**
        - Es un `PUT` de sustitución total, no un parche. Si se omite `description` pasa a `null` y si se omite `ingredients`
          se borran todos los ingredientes del plato (`[]`).
        - A diferencia de la creación, `available` **no tiene valor por defecto**: si se omite, el plato queda como no
          disponible en base de datos y el campo falta en la respuesta. Se recomienda enviarlo siempre.
        - Mismas limitaciones que en la creación respecto a tipos no validados, errores `500` en ingredientes inválidos o
          duplicados y escritura no transaccional.
        - No se comprueba que el plato pertenezca al `restaurantId` de la ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishUpdateRequest'
            example:
              name: Pizza Margarita
              description: Pizza clásica con tomate, mozzarella fresca y albahaca
              price: 13
              category: principal
              available: true
              ingredients:
                - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                  quantity: 0.35
      responses:
        '200':
          description: Plato actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
              example:
                id: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
                name: Pizza Margarita
                description: Pizza clásica con tomate, mozzarella fresca y albahaca
                price: 13
                category: principal
                available: true
                restaurantId: rest-1
                ingredients:
                  - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                    quantity: 0.35
                createdAt: '2026-11-19T10:15:30.000Z'
                updatedAt: '2026-11-19T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/DishValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Platos]
      operationId: deleteDish
      summary: Eliminar un plato
      description: |
        Elimina el plato y sus filas de `dish_ingredients`.

        **Roles permitidos:** `admin`, `manager`.

        Si el plato está referenciado por líneas de pedido (`order_items`) la clave foránea de SQLite impide el borrado y la API
        responde `500 InternalServerError` (no existe un `409` explícito en el código). No se comprueba la pertenencia al
        `restaurantId` de la ruta.
      responses:
        '204':
          description: Plato eliminado. Sin cuerpo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/restaurants/{restaurantId}/dishes:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Platos (público)]
      operationId: listPublicDishes
      summary: Carta pública del restaurante
      description: |
        Devuelve los platos **disponibles** (`available = true`) del restaurante. Endpoint público: no requiere
        autenticación ni rol.

        El filtrado se hace en memoria después de leer todos los platos del restaurante. La estructura de cada plato es la misma
        que en el listado privado (incluye `ingredients`). Si el restaurante no existe devuelve `200` con `[]`.
      security: []
      responses:
        '200':
          description: Lista de platos disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
              example:
                - id: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
                  name: Pizza Margarita
                  description: Pizza clásica con tomate, mozzarella y albahaca
                  price: 12.5
                  category: principal
                  available: true
                  restaurantId: rest-1
                  ingredients:
                    - ingredientId: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
                      quantity: 0.3
                  createdAt: '2026-11-19T10:15:30.000Z'
                  updatedAt: '2026-11-19T10:15:30.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtenido en el login (`/auth/login`), válido 8 horas. El payload incluye el rol del usuario
        (`admin`, `manager`, `camarero`, `cocinero`, `cliente`), que se comprueba en cada endpoint.
  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Identificador del restaurante (cadena; en los datos de seed tiene forma `rest-1`, `rest-2`).
      schema:
        type: string
        minLength: 1
      example: rest-1
    DishId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del plato.
      schema:
        type: string
        format: uuid
      example: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
  schemas:
    DishCategory:
      type: string
      description: Categoría del plato.
      enum: [entrante, principal, postre, bebida]
    DishIngredient:
      type: object
      description: Ingrediente utilizado por un plato y cantidad necesaria.
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
          description: |
            Id del ingrediente. No puede ser vacío y debe existir en `ingredients` (FK). Un valor vacío provoca `500`
            (error genérico, no `400`).
          example: 3f0c2a4e-6b1d-4c1a-9d52-7a2f8e0b1c11
        quantity:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Cantidad del ingrediente por ración, en la unidad del ingrediente. Debe ser mayor que 0.
          example: 0.3
    Dish:
      type: object
      description: Plato de la carta de un restaurante.
      required: [id, name, description, price, category, available, restaurantId, ingredients, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 5d1c8a0e-2b3f-4a6d-9c7e-1f2a3b4c5d6e
        name:
          type: string
          example: Pizza Margarita
        description:
          type: [string, "null"]
          example: Pizza clásica con tomate, mozzarella y albahaca
        price:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 12.5
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          description: Indica si el plato está disponible en la carta pública.
          example: true
        restaurantId:
          type: string
          example: rest-1
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-19T10:15:30.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-19T10:15:30.000Z'
    DishCreateRequest:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre del plato. No puede estar vacío ni ser solo espacios. Se guarda tal cual (sin trim).
          example: Pizza Margarita
        description:
          type: [string, "null"]
          default: null
          description: Descripción opcional. Si se omite se guarda `null`.
          example: Pizza clásica con tomate, mozzarella y albahaca
        price:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Precio, estrictamente mayor que 0.
          example: 12.5
        category:
          type: string
          description: |
            Categoría. Valores válidos: `entrante`, `principal`, `postre`, `bebida`. Se normaliza con trim y minúsculas
            antes de validar (p. ej. ` Principal ` se acepta y se guarda como `principal`).
          example: principal
        available:
          type: boolean
          default: true
          description: Disponibilidad del plato. Por defecto `true`.
        ingredients:
          type: array
          default: []
          description: Ingredientes del plato. Por defecto lista vacía. No debe repetir `ingredientId`.
          items:
            $ref: '#/components/schemas/DishIngredient'
    DishUpdateRequest:
      type: object
      description: Reemplazo completo del plato (ver la descripción de la operación para el tratamiento de campos omitidos).
      required: [name, price, category, available]
      properties:
        name:
          type: string
          minLength: 1
          example: Pizza Margarita
        description:
          type: [string, "null"]
          description: Si se omite pasa a `null`.
          example: Pizza clásica con tomate, mozzarella fresca y albahaca
        price:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 13
        category:
          type: string
          description: Igual que en la creación (se normaliza con trim y minúsculas).
          example: principal
        available:
          type: boolean
          description: |
            Sin valor por defecto en la actualización: si se omite el plato queda no disponible (se guarda `0`).
            Marcado como obligatorio en este contrato para evitar ese efecto, aunque el servidor no lo rechaza.
          example: true
        ingredients:
          type: array
          default: []
          description: Lista completa de ingredientes; sustituye a la anterior. Si se omite se vacía.
          items:
            $ref: '#/components/schemas/DishIngredient'
    DomainError:
      type: object
      description: Cuerpo de error devuelto por el `errorHandler` para errores de dominio (`AppError`) y para errores no controlados.
      required: [error, message]
      properties:
        error:
          type: string
          description: Nombre de la clase de error.
          enum:
            - DishNameRequiredError
            - InvalidPriceError
            - InvalidCategoryError
            - RestaurantIdRequiredError
            - DishNotFoundError
            - InternalServerError
        message:
          type: string
          description: Mensaje en inglés.
    AuthError:
      type: object
      description: Cuerpo de error de los middlewares `authenticate` y `authorize` (sin campo `message`).
      required: [error]
      properties:
        error:
          type: string
          example: 'Unauthorized: No token provided'
  responses:
    DishValidationError:
      description: |
        Error de validación de dominio. Posibles errores: `DishNameRequiredError` (nombre vacío), `InvalidPriceError`
        (precio <= 0), `InvalidCategoryError` (categoría fuera del enumerado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          examples:
            nombreVacio:
              summary: Nombre vacío
              value:
                error: DishNameRequiredError
                message: Dish name is required
            precioInvalido:
              summary: Precio no positivo
              value:
                error: InvalidPriceError
                message: Price must be a positive number
            categoriaInvalida:
              summary: Categoría no válida
              value:
                error: InvalidCategoryError
                message: 'Invalid category: tapas. Must be one of: entrante, principal, postre, bebida'
    Unauthorized:
      description: |
        No autenticado. Mensajes posibles: `Unauthorized: No token provided` (falta la cabecera `Authorization: Bearer`),
        `Unauthorized: Malformed token` y `Unauthorized: Invalid token` (JWT inválido o caducado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error: 'Unauthorized: Invalid token'
    Forbidden:
      description: El rol del usuario autenticado no está entre los permitidos para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error: 'Forbidden: Insufficient permissions'
    DishNotFound:
      description: No existe un plato con ese `id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: DishNotFoundError
            message: Dish not found
    InternalServerError:
      description: |
        Error no controlado. Incluye: errores de SQLite (violaciones de clave foránea, restaurante o ingrediente inexistente,
        ingredientes duplicados, borrado de un plato con pedidos), errores de validación de `ingredients`
        (lanzados como `Error` genérico), campos con tipo incorrecto o ausentes (`category`, `price`) y cuerpos JSON mal formados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InternalServerError
            message: Something went wrong
